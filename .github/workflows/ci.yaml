name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      GO_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Comprobar formato
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Archivos sin formatear:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Migraciones
        run: |
          go install github.com/gobuffalo/pop/v6/soda@v6.4.1
          soda migrate -e test

      - name: Tests
        run: go test -p 1 ./...

      - name: Build
        run: go build ./...

  e2e:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Navegador
        run: npx playwright install --with-deps chromium

      # playwright.config.ts arranca la aplicación con GO_ENV=test, que migra la base al arrancar.
      - name: Tests de navegador
        run: npx playwright test

      - name: Informe de los tests de navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t todo .
